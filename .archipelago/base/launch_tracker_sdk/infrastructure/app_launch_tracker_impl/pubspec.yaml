name: app_launch_tracker_impl
description: App launch tracker implementation with step and duration logging.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  dependencies:
    path: ../../shared/dependencies
  flutter:
    sdk: flutter
  monitoring_api:
    path: ../monitoring_api

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.0.2
  very_good_analysis: ">=10.3.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.archipelago.app_launch_tracker
        pluginClass: LaunchTimeTrackerPlugin
      ios:
        pluginClass: LaunchTimeTrackerPlugin

# Declares the package's DI module so `monorepo_toolkit generate
# host-registry` can regenerate the host injector's marker regions without
# losing this registration. No real ordering constraint on other infra
# packages, so `depends_on` is intentionally left empty.
archipelago:
  di_modules:
    - class: AppLaunchTrackerImplPackageModule
