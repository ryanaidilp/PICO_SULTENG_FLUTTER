name: pico_data_impl
description: Pico Data data implementation, with repositories, data sources and DI.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  dependencies:
    path: ../../../shared/dependencies
  flutter:
    sdk: flutter
  pico_data_api:
    path: ../pico_data_api

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.0.2
  very_good_analysis: ">=10.3.0"

# Lets `monorepo_toolkit generate host-registry` rebuild the host injector's
# marker regions without dropping this package's registration.
archipelago:
  di_modules:
    - class: PicoDataImplPackageModule
