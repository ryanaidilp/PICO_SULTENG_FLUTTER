# Size and dependency guards. The Dart-only guards run on every PR. The
# APK/IPA builds behind the size and permission checks run only where a
# release is decided: PRs into main, release/* and hotfix/* PRs, and manual
# runs. A skipped job reports success, so it can still be a required check.
name: PR Checks

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  size-guard:
    name: Size Guard (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
        working-directory: devtools/monorepo_toolkit
      - name: Run size-guard (PR scope)
        run: dart run monorepo_toolkit size-guard check --changed-only
        working-directory: devtools/monorepo_toolkit

  detect-new-library:
    name: Detect New Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
        working-directory: devtools/monorepo_toolkit
      - name: Run detect-new-library
        run: dart run monorepo_toolkit detect-new-library check
        working-directory: devtools/monorepo_toolkit

  android-size-analysis:
    name: Android Size Analysis
    if: >-
      github.event_name == 'workflow_dispatch' || github.base_ref == 'main' ||
      startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Android Gradle plugins such as MoEngage's need JDK 19+;
      # ubuntu-latest defaults to JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: dart pub get
      - name: Melos bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Initialize and switch env config
        run: |
          melos run env:init
          melos run env:switch -- development
      # *.g.dart/*.config.dart/*.gr.dart are gitignored, so a fresh CI
      # checkout has none of them — without this step the build below fails
      # immediately on missing generated sources (Archipelago-9n5c). Must run
      # after the env steps above: app_config's envied codegen hard-fails on
      # a missing/empty .env (Archipelago-r3mx).
      - name: Generate code (build_runner)
        run: melos run build
      # Separate generator from build_runner: <app>_asset's `lib/src/generated/`
      # (icon/animation/logo constants) is also gitignored, and is produced by
      # this bespoke codegen command, not build_runner — the step above does
      # not cover it. Without this step the build below fails with "No such
      # file or directory" on the asset package's generated barrel
      # (Archipelago-lagb).
      - name: Generate code (assets)
        run: melos run asset-gen:generate
      - name: Build with analyze-size
        run: |
          flutter build apk \
            --flavor development \
            --target-platform android-arm64 \
            --analyze-size \
            --no-tree-shake-icons
        working-directory: apps/pico
      - name: Run size-analyzer
        run: |
          dart run monorepo_toolkit size-analyzer analyze \
            --json ../../apps/pico/build/flutter_size_*/*-code-size-analysis.json \
            --baseline size_baseline/android.json \
            --platform android
        working-directory: devtools/monorepo_toolkit
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/pico/build/app/outputs/flutter-apk/app-development-release.apk
          retention-days: 1

  android-permission-guard:
    name: Android Permission Guard
    runs-on: ubuntu-latest
    needs: android-size-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apps/pico/build/app/outputs/flutter-apk/
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
        working-directory: devtools/monorepo_toolkit
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Run permission-guard
        run: |
          dart run monorepo_toolkit permission-guard android \
            --apk ../../apps/pico/build/app/outputs/flutter-apk/app-development-release.apk \
            --baseline permission_baseline/android.txt
        working-directory: devtools/monorepo_toolkit

  ios-size-analysis:
    name: iOS Size Analysis
    if: >-
      github.event_name == 'workflow_dispatch' || github.base_ref == 'main' ||
      startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Melos bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Initialize and switch env config
        run: |
          melos run env:init
          melos run env:switch -- development
      # *.g.dart/*.config.dart/*.gr.dart are gitignored, so a fresh CI
      # checkout has none of them — without this step the build below fails
      # immediately on missing generated sources (Archipelago-9n5c). Must run
      # after the env steps above: app_config's envied codegen hard-fails on
      # a missing/empty .env (Archipelago-r3mx).
      - name: Generate code (build_runner)
        run: melos run build
      # Separate generator from build_runner: <app>_asset's `lib/src/generated/`
      # (icon/animation/logo constants) is also gitignored, and is produced by
      # this bespoke codegen command, not build_runner — the step above does
      # not cover it. Without this step the build below fails with "No such
      # file or directory" on the asset package's generated barrel
      # (Archipelago-lagb).
      - name: Generate code (assets)
        run: melos run asset-gen:generate
      - name: Build with analyze-size
        run: |
          flutter build ipa \
            --flavor development \
            --analyze-size \
            --no-codesign
        working-directory: apps/pico
      - name: Run size-analyzer
        run: |
          dart run monorepo_toolkit size-analyzer analyze \
            --json ../../apps/pico/build/flutter_size_*/*-code-size-analysis.json \
            --baseline size_baseline/ios.json \
            --platform ios
        working-directory: devtools/monorepo_toolkit
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/pico/build/ios/ipa/*.ipa
          retention-days: 1

  ios-permission-guard:
    name: iOS Permission Guard
    runs-on: macos-latest
    needs: ios-size-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: apps/pico/build/ios/ipa/
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
        working-directory: devtools/monorepo_toolkit
      - name: Run permission-guard
        run: |
          dart run monorepo_toolkit permission-guard ios \
            --ipa ../../apps/pico/build/ios/ipa/*.ipa \
            --baseline permission_baseline/ios.txt
        working-directory: devtools/monorepo_toolkit
