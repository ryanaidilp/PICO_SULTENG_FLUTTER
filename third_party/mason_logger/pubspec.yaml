name: mason_logger
description: A reusable Dart logger used by the Mason CLI (package:mason_cli).
version: 0.3.5
homepage: https://github.com/felangel/mason
repository: https://github.com/felangel/mason
issue_tracker: https://github.com/felangel/mason/issues
documentation: https://github.com/felangel/mason/tree/master/packages/mason_logger#readme
topics: [cli, logger, mason]
funding: [https://github.com/sponsors/felangel]

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  ffi: ^2.1.3
  io: ^1.0.4
  win32: ^6.3.0

# dev_dependencies intentionally omitted: this vendored copy is consumed
# read-only as a path dependency (see PROVENANCE.md); its own test suite
# is not run inside this monorepo, and its dev_dependencies were dropped
# to avoid tripping sync_brick_deps' version-consistency check against
# this workspace's own test/meta/mocktail pins.
