name: monitoring_impl
description: Monitoring implementation with system logger.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  app_utilities:
    path: ../../utilities/app_utilities
  consent_api:
    path: ../../shared/consent_api
  dependencies:
    path: ../../shared/dependencies
  flutter:
    sdk: flutter
  monitoring_api:
    path: ../monitoring_api

dev_dependencies:
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  very_good_analysis: ">=10.3.0"

# Declares the package's DI module so `monorepo_toolkit generate
# host-registry` can regenerate the host injector's marker regions without
# losing this registration. No real ordering constraint on other infra
# packages, so `depends_on` is intentionally left empty.
archipelago:
  di_modules:
    - class: MonitoringImplPackageModule
