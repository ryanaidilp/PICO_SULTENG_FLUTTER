name: pico_widgetbook
description: Widgetbook component showcase for Pico UI Kit
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pico_asset:
    path: ../../packages/pico_asset
  pico_ui_kit:
    path: ../../packages/pico_ui_kit
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.2.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  widgetbook_generator: ^3.9.0

flutter:
  uses-material-design: true
