name: prepare
description: "CLI command that prepares the workspace for a flavor (env switch + envied regen + build-prepare) before flutter run/build."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace


dependencies:
  args: ^2.7.0
  build_prepare:
    path: ../build_prepare
  path: ^1.9.1
  shared_scripts:
    path: ../shared_scripts

dev_dependencies:
  test: ^1.31.0
