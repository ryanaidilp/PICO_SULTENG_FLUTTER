name: app_config
description: >
  Centralized configuration package for environment variables and flavor
  management. Uses envied for obfuscated compile-time env var injection.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace


dependencies:
  envied: ^1.3.8

dev_dependencies:
  build_runner: ^2.15.1
  envied_generator: ^1.3.8
  lints: ^6.1.0
  very_good_analysis: ">=10.3.0"
