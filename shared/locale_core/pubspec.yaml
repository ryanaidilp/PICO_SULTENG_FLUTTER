name: locale_core
description: "Internationalization package for Pico using slang."
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Backs AppLocaleController's default LocaleStore. Already resolved by every
  # generated project (shared/consent_impl uses it for the consent record), so
  # this declares an existing dependency rather than adding a new one.
  shared_preferences: ^2.5.5
  slang: ^4.18.0
  slang_flutter: ^4.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  slang_build_runner: ^4.18.0
