name: push_notification_impl
description: Push notification SDK orchestrator — aggregates provider handlers and exposes the unified PushNotificationSDK.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  async: ^2.13.1
  consent_api:
    path: ../../../shared/consent_api
  dependencies:
    path: ../../../shared/dependencies
  feature_sdk:
    path: ../../../shared/feature_sdk
  flutter:
    sdk: flutter
  flutter_timezone: ^5.1.0
  identifiers:
    path: ../../../shared/identifiers
  locale_core:
    path: ../../../shared/locale_core
  pico_ui_kit:
    path: ../../../packages/pico_ui_kit
  push_notification_api:
    path: ../push_notification_api
  router_registry:
    path: ../../../shared/router_registry
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  google_fonts: ^8.2.1
  injectable_generator: ^3.0.2
  mocktail: ^1.0.5
  slang_build_runner: ^4.18.0
  very_good_analysis: ">=10.3.0"

# PushNotificationGlobalModule.init() eagerly reads
# GetIt.instance.getAll<PushNotificationProviderHandler>(), so provider
# packages must already be registered. With includeFcm the FCM provider is
# listed below; without it there is no depends_on until a provider brick
# (push_notification_onesignal, Pro) adds its package -- see that brick's
# hooks/post_gen.dart.
archipelago:
  di_modules:
    - class: PushNotificationGlobalModule
      depends_on:
        - push_notification_onesignal_impl

