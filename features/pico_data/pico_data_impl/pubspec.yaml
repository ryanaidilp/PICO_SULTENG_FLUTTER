name: pico_data_impl
description: Pico Data data implementation, with repositories, data sources and DI.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  app_config:
    path: ../../../shared/app_config
  dependencies:
    path: ../../../shared/dependencies
  flutter_cache_manager: ^3.4.5
  path_provider: ^2.1.6
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.5.5
  test_prereq:
    path: ../../../utilities/test_prereq
  flutter:
    sdk: flutter
  pico_data_api:
    path: ../pico_data_api

flutter:
  assets:
    - assets/seed/

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.0.2
  very_good_analysis: ">=10.3.0"

# Lets `monorepo_toolkit generate host-registry` rebuild the host injector's
# marker regions without dropping this package's registration.
archipelago:
  di_modules:
    - class: PicoDataImplPackageModule
  test_prerequisites:
    - class: PicoDataImplTestPrerequisite
      reason: >-
        PicoDataImplModule's @preResolve getters call shared_preferences and
        path_provider (application support directory) during $initGetIt.
